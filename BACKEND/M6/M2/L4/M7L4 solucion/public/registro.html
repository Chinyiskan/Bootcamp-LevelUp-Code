<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Piloto | LevelUp Code</title>
  <link rel="stylesheet" href="./css/estilo.css">
</head>
<body>

  <header class="barra-navegacion">
    <div class="logo-hangar">
      <svg class="icono icono-lg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      <span>HANGAR DE MECHAS :: RECLUTAMIENTO</span>
    </div>
  </header>

  <main class="contenedor-principal">
    <div class="contenedor-auth">
      <div class="auth-header">
        <h1>Ficha de Reclutamiento</h1>
        <p>Registra tu perfil de piloto para recibir tu hangar privado</p>
      </div>

      <div id="mensajeAlerta" style="display: none;"></div>

      <form id="formularioRegistro" class="formulario-grid" style="grid-template-columns: 1fr;">
        <div class="grupo-campo">
          <label for="nombre">Nombre / Distintivo del Piloto</label>
          <input type="text" id="nombre" class="campo-input" placeholder="Ej: Valquiria-01" required autocomplete="name">
        </div>

        <div class="grupo-campo">
          <label for="correo">Correo Electrónico Oficial</label>
          <input type="email" id="correo" class="campo-input" placeholder="piloto@hangar.space" required autocomplete="email">
        </div>

        <div class="grupo-campo">
          <label for="clave">Código de Seguridad (Contraseña)</label>
          <input type="password" id="clave" class="campo-input" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
        </div>

        <button type="submit" id="btnRegistrar" class="btn btn-primario" style="margin-top: 0.5rem;">
          Completar Registro Militar
        </button>
      </form>

      <div class="auth-enlace">
        ¿Ya tienes rango registrado? <a href="./login.html">Iniciar sesión aquí</a>
      </div>
    </div>
  </main>

  <script src="./js/registro.js"></script>
</body>
</html>
